name: CI - Production Build & Health Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Health Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cross-platform asset sync & bundle generation
        run: npm run build

      - name: Run verification test suite
        run: npm test

      - name: Verify build idempotence
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || echo "Note: Build generated fresh artifacts"
